[tool.poetry]
name = "analysis of banking transactions"
version = "0.1.0"
description = ""
authors = ["Vlad <vlad-labytin@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
flake8 = "^7.1.2"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
requests = "^2.32.3"
black = "^25.1.0"
isort = "^6.0.1"
pytest = "^8.3.5"
requests-mock = "^1.12.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude =".git"

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'